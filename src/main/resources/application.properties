spring.application.name=webcv-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

supabase.s3.endpoint=${S3_URL}
supabase.s3.access-key=${S3_ACCESS_KEY_ID}
supabase.s3.secret-key=${S3_ACCESS_SECRET_KEY}
supabase.s3.bucket-name=${BUCKET_NAME}
supabase.s3.region=${AWS_REGION}

s3.path-style-enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:changelog/db.changelog-master.xml

spring.messages.basename=webcv/i18n/messages

spring.servlet.multipart.max-request-size=125MB
spring.servlet.multipart.max-file-size=100MB

telegram.bot.token=${TG_TOKEN}
telegram.bot.id=${TG_CHAT_ID}

turnstile.secret-key=${TURNSTILE_SECRET_KEY}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

