spring.application.name=webcv-backend-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

supabase.s3.endpoint=https://mock-supabase-url.com
supabase.s3.access-key=mock-access-key-id
supabase.s3.secret-key=mock-secret-key-value
supabase.s3.bucket-name=mock-bucket-name
supabase.s3.region=us-east-1

spring.messages.basename=webcv/i18n/messages
spring.servlet.multipart.max-request-size=150MB
spring.servlet.multipart.max-file-size=100MB
telegram.bot.token=123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ
telegram.bot.id=987654321
turnstile.secret-key=mock-turnstile-secret-key
